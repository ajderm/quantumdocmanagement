name: renderer

on:
  push:
    paths: ['renderer/**', '.github/workflows/renderer.yml']
  pull_request:
    paths: ['renderer/**', '.github/workflows/renderer.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Both drivers must render identically
        run: npm run test:parity
      - name: Render the corpus and keep the PDFs
        run: npm run corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-pdfs
          path: renderer/out/*.pdf
          retention-days: 14
