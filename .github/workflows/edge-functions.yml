name: unit tests

on:
  push:
    paths: ['supabase/functions/**', 'src/lib/**', '.github/workflows/edge-functions.yml']
  pull_request:
    paths: ['supabase/functions/**', 'src/lib/**', '.github/workflows/edge-functions.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The policy and parser modules are deliberately dependency-free so they
      # can be tested here without an edge runtime or an npm install.
      - run: npm run test:all
